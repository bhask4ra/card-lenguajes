<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <radialGradient id="portal" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="60%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </radialGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado estilo app icon -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" />

  <!-- Anillo exterior del Portal -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#34d399" stroke-width="24" stroke-dasharray="16 12" filter="url(#glow)" />

  <!-- Núcleo del Portal -->
  <circle cx="256" cy="256" r="120" fill="url(#portal)" />

  <!-- Letras centrales RM con estilo nítido -->
  <text x="256" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="96" font-weight="900" fill="#ffffff" text-anchor="middle" dominant-baseline="central" letter-spacing="2">
    RM
  </text>
</svg>
